name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: runner / pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # tests/__init__.py opens library.json relative to the working directory,
      # so this has to run from the repository root.
      - run: pytest -v
